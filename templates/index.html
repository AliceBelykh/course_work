<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ тональности текстов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
        }
        
        .tab:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        select, input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            animation: fadeIn 0.5s;
        }
        
        .result.positive {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }
        
        .result.negative {
            background: #ffebee;
            border-left: 4px solid #f44336;
        }
        
        .result.neutral {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
        }
        
        .sentiment-label {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .confidence {
            font-size: 18px;
            color: #666;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #4caf50;
            transition: width 0.3s;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .preview-table th, .preview-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .preview-table th {
            background: #f5f5f5;
            font-weight: 600;
        }
        
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .file-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .download-btn {
            background: #4caf50;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Анализ тональности текстов</h1>
            <p>Определение эмоциональной окраски на русском языке с помощью RuBERT</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('text')">📝 Анализ текста</button>
            <button class="tab" onclick="switchTab('csv')">📁 Анализ CSV файла</button>
            <button class="tab" onclick="switchTab('kinopoisk')">🎬 Кинопоиск</button>
        </div>
        
        <!-- Вкладка с текстом -->
        <div id="textTab" class="card">
            <h2>📝 Анализ одного текста</h2>
            
            <div style="margin-bottom: 15px;">
                <label>Модель:</label>
                <select id="textModel">
                    <option value="tiny">Лёгкая (быстрая)</option>
                    <option value="base">Точная (медленнее)</option>
                    <option value="multilingual">Мультиязычная</option>
                </select>
                
                <label style="margin-left: 15px;">Очистка:</label>
                <select id="cleanLevel">
                    <option value="minimal">Минимальная</option>
                    <option value="standard" selected>Стандартная</option>
                    <option value="aggressive">Агрессивная</option>
                </select>
            </div>
            
            <textarea id="textInput" placeholder="Введите текст для анализа...&#10;&#10;Например:&#10;Отличный фильм, очень понравилась игра актёров!"></textarea>
            
            <button onclick="analyzeText()" style="margin-top: 15px;">🔍 Анализировать</button>
            
            <div id="textResult"></div>
        </div>
        
        <!-- Вкладка с CSV -->
        <div id="csvTab" class="card" style="display: none;">
            <h2>📁 Анализ CSV файла</h2>
            
            <div style="margin-bottom: 15px;">
                <label>Модель:</label>
                <select id="csvModel">
                    <option value="tiny">Лёгкая (быстрая)</option>
                    <option value="base">Точная (медленнее)</option>
                    <option value="multilingual">Мультиязычная</option>
                </select>
                
                <label style="margin-left: 15px;">Колонка с текстом:</label>
                <input type="text" id="textColumn" value="text" style="width: 150px;">
                
                <label style="margin-left: 15px;">Очистка:</label>
                <select id="csvCleanLevel">
                    <option value="minimal">Минимальная</option>
                    <option value="standard" selected>Стандартная</option>
                    <option value="aggressive">Агрессивная</option>
                </select>
            </div>
            
            <div style="border: 2px dashed #e0e0e0; border-radius: 8px; padding: 30px; text-align: center;">
                <input type="file" id="csvFile" accept=".csv" style="display: none;">
                <button onclick="document.getElementById('csvFile').click()">📂 Выбрать CSV файл</button>
                <p style="margin-top: 10px; color: #666; font-size: 14px;">
                    Поддерживаются файлы с колонкой 'text' (UTF-8)
                </p>
            </div>
            
            <div id="csvResult"></div>
        </div>
        <!-- Вкладка с Кинопоиском -->
        <div id="kinopoiskTab" class="card" style="display: none;">
            <h2>🎬 Анализ отзывов из Кинопоиска</h2>
            
            <div style="margin-bottom: 15px;">
                <label>Название фильма:</label>
                <input type="text" id="movieSearchInput" placeholder="Например: Матрица, Брат, Интерстеллар..." 
                    style="width: 60%; margin-left: 10px;">
                <button onclick="searchMovie()" id="searchBtn">🔍 Найти фильм</button>
                <button onclick="showAllMovies()" style="background: #666; margin-left: 10px;">📋 Все фильмы</button>
            </div>
            
            <div id="searchResults" style="margin-top: 15px; display: none;">
                <h3>Результаты поиска:</h3>
                <div id="moviesList" style="max-height: 250px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px;"></div>
                <div style="margin-top: 15px;">
                    <button onclick="analyzeSelectedMovie()" id="analyzeBtn" disabled>📊 Анализировать отзывы</button>
                </div>
            </div>
            
            <div id="kinopoiskResult"></div>
        </div>
    </div>
    
    <script>
        function switchTab(tab) {
            document.getElementById('textTab').style.display = tab === 'text' ? 'block' : 'none';
            document.getElementById('csvTab').style.display = tab === 'csv' ? 'block' : 'none';
            
            document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        async function analyzeText() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) {
                alert('Введите текст для анализа');
                return;
            }
            
            const resultDiv = document.getElementById('textResult');
            resultDiv.innerHTML = '<div class="loader" style="margin: 20px auto; display: block;"></div><p style="text-align: center;">Анализируем...</p>';
            
            try {
                const response = await fetch('/api/analyze/text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        model_id: document.getElementById('textModel').value,
                        clean_level: document.getElementById('cleanLevel').value
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const result = data.data;
                    const sentimentEmoji = {
                        'positive': '😊',
                        'negative': '😞',
                        'neutral': '😐'
                    }[result.sentiment];
                    
                    resultDiv.innerHTML = `
                        <div class="result ${result.sentiment}">
                            <div class="sentiment-label">
                                ${sentimentEmoji} ${result.sentiment_label}
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${result.confidence * 100}%; background: ${
                                    result.sentiment === 'positive' ? '#4caf50' : 
                                    result.sentiment === 'negative' ? '#f44336' : '#ff9800'
                                }"></div>
                            </div>
                            <div class="confidence">
                                Уверенность: ${(result.confidence * 100).toFixed(1)}%
                            </div>
                            <div style="margin-top: 10px; font-size: 14px; color: #666;">
                                Модель: ${result.model_used}<br>
                                Длина текста: ${result.text_length} символов
                                ${result.chunks_analyzed > 1 ? `<br>Частей: ${result.chunks_analyzed}` : ''}
                            </div>
                            <div style="margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 4px;">
                                <strong>Текст:</strong><br>
                                "${result.text}"
                            </div>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="result neutral">Ошибка: ${data.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result neutral">Ошибка: ${error.message}</div>`;
            }
        }
        
        document.getElementById('csvFile').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const resultDiv = document.getElementById('csvResult');
            resultDiv.innerHTML = '<div class="loader" style="margin: 20px auto; display: block;"></div><p style="text-align: center;">Загружаем и анализируем файл...</p>';
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('model_id', document.getElementById('csvModel').value);
            formData.append('text_column', document.getElementById('textColumn').value);
            formData.append('clean_level', document.getElementById('csvCleanLevel').value);
            
            try {
                const response = await fetch('/api/upload/csv', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const stats = data.data.stats;
                    
                    resultDiv.innerHTML = `
                        <div class="file-info">
                            <h3>✅ Анализ завершён!</h3>
                            <div class="stats">
                                <div class="stat-card">
                                    <div class="stat-value">${stats.total}</div>
                                    <div class="stat-label">Всего отзывов</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" style="color: #4caf50;">${stats.positive}</div>
                                    <div class="stat-label">Положительных</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" style="color: #f44336;">${stats.negative}</div>
                                    <div class="stat-label">Отрицательных</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" style="color: #ff9800;">${stats.neutral}</div>
                                    <div class="stat-label">Нейтральных</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value">${(stats.avg_confidence * 100).toFixed(1)}%</div>
                                    <div class="stat-label">Средняя уверенность</div>
                                </div>
                            </div>
                            
                            <button class="download-btn" onclick="downloadFile('${data.data.result_filename}')">
                                💾 Скачать результаты (CSV)
                            </button>
                            
                            <h3 style="margin-top: 20px;">Пример результатов:</h3>
                            <table class="preview-table">
                                <thead>
                                    <tr><th>Текст</th><th>Тональность</th><th>Уверенность</th></tr>
                                </thead>
                                <tbody>
                                    ${data.data.preview.map(item => `
                                        <tr>
                                            <td>${item[Object.keys(item)[0]].substring(0, 50)}...</td>
                                            <td>${item.sentiment_label}</td>
                                            <td>${(item.confidence * 100).toFixed(1)}%</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="result neutral">❌ Ошибка: ${data.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result neutral">❌ Ошибка: ${error.message}</div>`;
            }
        });
        
        async function downloadFile(filename) {
            window.location.href = `/api/download/${filename}`;
        }

        // ============================================
        // ФУНКЦИИ ДЛЯ РАБОТЫ С КИНОПОИСКОМ (ЛОКАЛЬНЫЙ ДАТАСЕТ)
        // ============================================

        let selectedMovie = null;

        async function searchMovie() {
            const query = document.getElementById('movieSearchInput').value;
            if (!query.trim()) {
                alert('Введите название фильма');
                return;
            }
            
            const searchBtn = document.getElementById('searchBtn');
            const resultsDiv = document.getElementById('searchResults');
            const moviesListDiv = document.getElementById('moviesList');
            
            searchBtn.disabled = true;
            searchBtn.textContent = '⏳ Поиск...';
            resultsDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/movies/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    moviesListDiv.innerHTML = data.data.map(movie => `
                        <div style="padding: 10px; border-bottom: 1px solid #e0e0e0; cursor: pointer;" 
                            onclick="selectMovie('${movie.id}', '${movie.name.replace(/'/g, "\\'")}')">
                            <strong>${movie.name}</strong>
                            <span style="color: #666; margin-left: 10px;">${movie.year || '—'}</span>
                            <span style="color: #ff9800; margin-left: 10px;">⭐ ${movie.rating || '—'}</span>
                            <span style="color: #4caf50; margin-left: 10px;">📝 ${movie.reviews_count} отзывов</span>
                        </div>
                    `).join('');
                    resultsDiv.style.display = 'block';
                } else {
                    moviesListDiv.innerHTML = `<p style="color: #f44336;">❌ Фильм "${query}" не найден</p>`;
                    resultsDiv.style.display = 'block';
                }
            } catch (error) {
                moviesListDiv.innerHTML = `<p style="color: #f44336;">❌ Ошибка: ${error.message}</p>`;
                resultsDiv.style.display = 'block';
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 Найти фильм';
            }
        }

        async function showAllMovies() {
            const resultsDiv = document.getElementById('searchResults');
            const moviesListDiv = document.getElementById('moviesList');
            
            try {
                const response = await fetch('/api/movies/list');
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    moviesListDiv.innerHTML = data.data.map(movie => `
                        <div style="padding: 10px; border-bottom: 1px solid #e0e0e0; cursor: pointer;" 
                            onclick="selectMovie('${movie.id}', '${movie.name.replace(/'/g, "\\'")}')">
                            <strong>${movie.name}</strong>
                            <span style="color: #666; margin-left: 10px;">${movie.year || '—'}</span>
                            <span style="color: #ff9800; margin-left: 10px;">⭐ ${movie.rating || '—'}</span>
                            <span style="color: #4caf50; margin-left: 10px;">📝 ${movie.reviews_count} отзывов</span>
                        </div>
                    `).join('');
                    resultsDiv.style.display = 'block';
                } else {
                    moviesListDiv.innerHTML = '<p style="color: #ff9800;">⚠️ Нет фильмов с рецензиями</p>';
                    resultsDiv.style.display = 'block';
                }
            } catch (error) {
                moviesListDiv.innerHTML = `<p style="color: #f44336;">❌ Ошибка: ${error.message}</p>`;
                resultsDiv.style.display = 'block';
            }
        }

        function selectMovie(movieId, movieName) {
            selectedMovie = { id: movieId, name: movieName };
            
            document.querySelectorAll('#moviesList div').forEach(div => {
                div.style.background = 'white';
            });
            event.target.closest('div').style.background = '#e3f2fd';
            document.getElementById('analyzeBtn').disabled = false;
        }

        async function analyzeSelectedMovie() {
            if (!selectedMovie) {
                alert('Сначала выберите фильм');
                return;
            }
            
            const resultDiv = document.getElementById('kinopoiskResult');
            const analyzeBtn = document.getElementById('analyzeBtn');
            
            resultDiv.innerHTML = '<div class="loader" style="margin:20px auto;display:block"></div><p style="text-align:center">Анализ отзывов...</p>';
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = '⏳ Анализируем...';
            
            try {
                const response = await fetch('/api/movies/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: selectedMovie.name })
                });
                const data = await response.json();
                
                if (data.success) {
                    const s = data.data.stats;
                    const preview = data.data.reviews_preview;
                    
                    resultDiv.innerHTML = `
                        <div class="file-info" style="margin-top:20px">
                            <h3>🎬 Результаты: ${data.data.movie_name}</h3>
                            <div class="stats">
                                <div class="stat-card"><div class="stat-value">${s.total}</div><div>Всего</div></div>
                                <div class="stat-card"><div class="stat-value" style="color:#4caf50">${s.positive}</div><div>Положительных (${s.positive_percent}%)</div></div>
                                <div class="stat-card"><div class="stat-value" style="color:#f44336">${s.negative}</div><div>Отрицательных (${s.negative_percent}%)</div></div>
                                <div class="stat-card"><div class="stat-value" style="color:#ff9800">${s.neutral}</div><div>Нейтральных (${s.neutral_percent}%)</div></div>
                            </div>
                            <button onclick="window.location.href='/api/download/${data.data.csv_filename}'">💾 Скачать CSV</button>
                            <h3>📝 Примеры отзывов:</h3>
                            <table class="preview-table">
                                <thead><tr><th>Отзыв</th><th>Тональность</th><th>Уверенность</th></tr></thead>
                                <tbody>
                                    ${preview.slice(0, 10).map(r => `
                                        <tr><td>${r.text.substring(0, 80)}...</td><td>${r.sentiment_label}</td><td>${(r.confidence*100).toFixed(1)}%</td></tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="result neutral">❌ ${data.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result neutral">❌ ${error.message}</div>`;
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = '📊 Анализировать отзывы';
            }
        }

        function switchTab(tab) {
            document.getElementById('textTab').style.display = tab === 'text' ? 'block' : 'none';
            document.getElementById('csvTab').style.display = tab === 'csv' ? 'block' : 'none';
            document.getElementById('kinopoiskTab').style.display = tab === 'kinopoisk' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
